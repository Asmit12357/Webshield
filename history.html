<!DOCTYPE html>
<html>
<head>
    <title>Scan History</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="neon-bg p-5">
    <div class="container">
        <h1 class="neon-text text-center mb-4">Scan History</h1>
        <table class="table table-bordered neon-table">
            <thead>
                <tr><th>URL</th><th>Score</th><th>Timestamp</th></tr>
            </thead>
            <tbody>
                {% for row in rows %}
                <tr>
                    <td>{{ row['url'] }}</td>
                    <td>{{ row['score'] }}</td>
                    <td>{{ row['timestamp'] }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        <a href="/" class="btn btn-secondary mt-3">Back</a>
    </div>
</body>
</html>
